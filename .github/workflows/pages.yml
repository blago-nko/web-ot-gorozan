name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REPO_NAME: ${{ github.event.repository.name }}
  PILOT_SUBPATH: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.0"
      - name: Build
        run: hugo --minify
      - name: Fix redirect URLs for subpath (pilot only)
        run: |
          if [ "$PILOT_SUBPATH" = "true" ] && [ -d "public/seo-redirects" ]; then
            find public/seo-redirects -name "*.html" -exec sed -i "s|url=/|url=/${REPO_NAME}/|g" {} \;
            find public/seo-redirects -name "*.html" -exec sed -i "s|href=/|href=/${REPO_NAME}/|g" {} \;
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
