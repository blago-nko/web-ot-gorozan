<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
{{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
<style>
body{font-family:Georgia,'Times New Roman',serif;margin:0;background:#faf9f6;color:#222}
header{background:#22415f;padding:1rem 2rem}header a{color:#fff;text-decoration:none;font-size:1.3rem}
main{max-width:46rem;margin:2rem auto;padding:0 1rem;line-height:1.6}
.post-meta{color:#888;font-size:.9rem}
img{max-width:100%;height:auto}
h1{line-height:1.25}
h2,h3,h4,h5,h6{margin-top:1.5rem;line-height:1.3}
figure{margin:1rem 0;text-align:center}
figcaption{color:#888;font-size:.9rem;margin-top:.4rem}
</style>
</head>
<body>
<header><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></header>
<main>{{ block "main" . }}{{ end }}</main>
</body>
</html>
