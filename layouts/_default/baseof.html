<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    {{ if .Site.Params.noindex }}<meta name="robots" content="noindex, nofollow">{{ end }}
</head>
<body>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer>&copy; {{ now.Year }} НП «Общественное благополучие Воронежа»</footer>
</body>
</html>
